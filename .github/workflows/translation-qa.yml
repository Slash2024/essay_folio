name: Translation feature verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/translation-qa.yml
      - src/components/translation/**
      - src/lib/translation*.ts
      - src/server/translation*.ts
      - src/pages/api/translation.ts
      - src/data/translation-questions.json
      - tests/translation*.mjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node --test tests/translation.test.mjs tests/translation-review.test.mjs tests/translation-packet.test.mjs
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/translation-browser" --no-save playwright
          "$RUNNER_TEMP/translation-browser/node_modules/.bin/playwright" install --with-deps chromium
          ln -s "$RUNNER_TEMP/translation-browser/node_modules/playwright" node_modules/playwright
      - name: Verify actual translation UI and original navigation
        env:
          TRANSLATION_QA_DIR: ${{ runner.temp }}/translation-evidence
        run: node tests/translation-browser.mjs
      - name: Build verified Wix release
        env:
          WIX_CLIENT_ID: faf8e5aa-5dec-40eb-a4a3-17ca626abfcd
          WIX_CLOUD_PROVIDER: KUBERNETES
          WIX_CLIENT_INSTANCE_ID: set-at-release
          WIX_CLIENT_PUBLIC_KEY: set-at-release
          WIX_CLIENT_SECRET: set-at-release
        run: node --input-type=module -e "import {build} from 'astro';await build({root:process.cwd()});process.exit(0);"
      - name: Package verified source and build
        run: |
          python3 - <<'PY'
          import pathlib, shutil, subprocess, os
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'translation-release'
          out.mkdir()
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not name: continue
              assert not name.startswith('.env')
              target=out/name
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(root/name,target)
          for name in ['dist','.wix']:
              shutil.copytree(root/name,out/name,ignore=shutil.ignore_patterns('.cache','.prerender'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: translation-verified-release
          path: ${{ runner.temp }}/translation-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-qa-evidence
          path: ${{ runner.temp }}/translation-evidence/
          if-no-files-found: ignore
          retention-days: 7
